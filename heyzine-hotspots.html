<!-- Conocé Heyzine · imagen interactiva con hotspots · alto fijo 500 px -->
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0}</style>
<div class="hz">
  <style>
    .hz{--celeste:#8DE2D6;--azul:#035C80;--amarillo:#FFCD02;--marino:#1D3343;--fondo:#F4F7F8;--linea:#DCE5EA;--gris:#4A5B66;
      font-family:'Encode Sans',Arial,sans-serif;color:var(--marino);background:var(--fondo);border:1px solid var(--linea);border-radius:12px;overflow:hidden;
      width:100%;height:500px;max-height:500px;box-sizing:border-box;display:flex;flex-direction:column;position:relative}
    .hz *{box-sizing:border-box}
    .hz [hidden]{display:none !important}
    .hz-bar{display:flex;height:6px;flex:none}.hz-bar span{flex:1}

    .hz-top{flex:none;height:40px;display:flex;align-items:center;gap:10px;padding:0 18px}
    .hz-top b{font-size:16px;font-weight:800}
    .hz-top span{font-size:14px;color:var(--gris)}
    .hz-top i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--amarillo);color:var(--marino);font-size:11.5px;font-weight:800;margin:0 2px;vertical-align:3px}

    .hz-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 14px 14px}
    .hz-img{position:relative;width:min(100%, calc(430px * 1738 / 925));aspect-ratio:1738 / 925;border-radius:8px;box-shadow:0 2px 10px rgba(29,51,67,.14)}
    .hz-img>img{display:block;width:100%;height:100%;border-radius:8px;user-select:none;-webkit-user-drag:none}

    /* Hotspots */
    .hz-spot{all:unset;box-sizing:border-box;position:absolute;cursor:pointer;border:2px dashed rgba(255,205,2,.95);border-radius:5px;background:rgba(255,205,2,.10);transition:background .15s,border-color .15s}
    .hz-spot:hover,.hz-spot:focus-visible{background:rgba(255,205,2,.30);border-style:solid;border-color:var(--amarillo)}
    .hz-spot:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
    .hz-num{position:absolute;right:-11px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--amarillo);color:var(--marino);
      font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(29,51,67,.35)}
    .hz-spot[data-id="guardar"] .hz-num{top:-11px;right:-9px;transform:none}
    .hz-spot[data-id="compartir"] .hz-num{top:-11px;left:-9px;right:auto;transform:none}
    .hz-spot:not(.visto) .hz-num{animation:hzlate 2.4s ease-out infinite}
    @keyframes hzlate{0%{box-shadow:0 0 0 0 rgba(255,205,2,.75)}70%{box-shadow:0 0 0 8px rgba(255,205,2,0)}100%{box-shadow:0 0 0 0 rgba(255,205,2,0)}}
    .hz-spot.visto .hz-num{background:var(--azul);color:#fff}
    .hz-tip{position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--marino);color:#fff;font-size:12.5px;font-weight:700;
      padding:4px 9px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:3}
    .hz-spot[data-id="guardar"] .hz-tip,.hz-spot[data-id="compartir"] .hz-tip{left:50%;top:calc(100% + 8px);transform:translateX(-50%)}
    .hz-spot:hover .hz-tip,.hz-spot:focus-visible .hz-tip{opacity:1}
    @media (prefers-reduced-motion:reduce){.hz-spot .hz-num{animation:none !important}}

    /* Ventana emergente */
    .hz-modal{position:absolute;inset:0;z-index:20;background:rgba(29,51,67,.55);display:flex;align-items:center;justify-content:center;padding:18px}
    .hz-card{position:relative;width:min(900px,100%);height:min(440px,100%);background:#fff;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1.4fr 1fr;box-shadow:0 12px 36px rgba(29,51,67,.3)}
    .hz-media{background:var(--fondo);padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0;min-width:0}
    .hz-pest{display:flex;gap:4px;padding:4px;background:#fff;border:1px solid var(--linea);border-radius:10px;flex:none}
    .hz-pest button{all:unset;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--gris);padding:6px 14px;border-radius:7px}
    .hz-pest button[aria-selected="true"]{background:var(--azul);color:#fff}
    .hz-pest button:focus-visible{outline:3px solid var(--amarillo)}
    .hz-marco{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
    .hz-media img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;border:4px solid #60A57A;box-shadow:0 2px 10px rgba(29,51,67,.12);background:#fff}
    .hz-info{padding:26px 26px 22px;display:flex;flex-direction:column;gap:12px;min-height:0}
    .hz-eti{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--azul)}
    .hz-eti i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--amarillo);color:var(--marino);display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:0}
    .hz-info h3{margin:0;font-size:24px;line-height:1.2;font-weight:800;color:var(--marino)}
    .hz-info p{margin:0;font-size:16px;line-height:1.55;color:var(--marino)}
    .hz-cerrar{all:unset;box-sizing:border-box;cursor:pointer;font-family:inherit;margin-top:auto;align-self:flex-start;background:var(--azul);color:#fff;font-weight:700;font-size:15px;padding:10px 20px;border-radius:9px}
    .hz-x{all:unset;cursor:pointer;position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;color:var(--gris);background:rgba(255,255,255,.9)}
    .hz-x:hover{background:var(--fondo)}
    .hz-cerrar:focus-visible,.hz-x:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}

    @media (max-width:640px){
      .hz-top span.largo{display:none}
      .hz-card{grid-template-columns:1fr;grid-template-rows:44% 1fr}
      .hz-media{padding:10px}
      .hz-info{padding:14px 16px;gap:8px}
      .hz-info h3{font-size:19px}
      .hz-info p{font-size:14.5px;line-height:1.45}
      .hz-cerrar{padding:8px 16px;font-size:14px}
      .hz-num{width:15px;height:15px;font-size:9.5px;right:-9px}
      .hz-tip{display:none}
    }
  </style>

  <div class="hz-bar"><span style="background:#8DE2D6"></span><span style="background:#035C80"></span><span style="background:#FFCD02"></span><span style="background:#1D3343"></span></div>
  <div class="hz-top">
    <b>Conocé Heyzine</b>
    <span>Tocá cada número <i>#</i><span class="largo"> para ver para qué sirve esa función.</span></span>
  </div>

      var modal=root.querySelector('.hz-modal'), img=modal.querySelector('.hz-media img'), pest=modal.querySelector('.hz-pest'),
